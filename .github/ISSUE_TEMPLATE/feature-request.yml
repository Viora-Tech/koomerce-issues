name: Feature request
description: Something Koomerce should do, or do better.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job or problem, in your own words. For example "restock 200 SKUs at once".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: today
    attributes:
      label: How do you manage today?
      description: A workaround, another tool, or doing it by hand.
  - type: dropdown
    id: importance
    attributes:
      label: How much does it matter to you?
      options:
        - Nice to have
        - Saves me real time every week
        - It blocks me from using Koomerce for this
